[tool.poetry]
name = "dicom_viewer"
version = "0.1.0"
description = ""
authors = ["Milo Chen <milo_chen@mail2000.com.tw>"]
packages = [{ include = "dicom_viewer" }]

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
# <3.15 cap: numpy 2.4 (its last line for Python 3.11) has no CPython 3.15 wheels.
python = ">=3.11,<3.15"
reflex = "0.10.0"
pydicom = "*"
pillow = "*"
numpy = "*"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
